<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Fondo circular branco cun borde azul mariño -->
  <circle cx="50" cy="50" r="46" fill="#FFFFFF" stroke="#0066CC" stroke-width="5" />
  
  <!-- Eixos do Political Compass (4 cuadrantes sutís) -->
  <line x1="50" y1="10" x2="50" y2="90" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 3" />
  <line x1="10" y1="50" x2="90" y2="50" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="4 3" />

  <!-- Agulla Sur/Leste/Oeste en Azul Galego -->
  <polygon points="50,50 42,50 50,82 58,50" fill="#0066CC" />
  <polygon points="50,50 50,43 22,50 50,57" fill="#60A5FA" />
  <polygon points="50,50 50,43 78,50 50,57" fill="#0066CC" />

  <!-- Agulla Norte en Vermello (Estreleira / Acción) -->
  <polygon points="50,50 41,50 50,15 59,50" fill="#DC2626" />

  <!-- Centro do compás -->
  <circle cx="50" cy="50" r="6" fill="#FFFFFF" stroke="#0F172A" stroke-width="3" />
</svg>